<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>URL Safety Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 400px;
      padding: 10px;
      background-color: #1e1e1e;
      color: #e0e0e0;
    }

    h3 {
      color: #ffffff;
      text-align: center;
    }

    pre {
      background: #2c2c2c;
      color: #ffffff;
      padding: 10px;
      border-radius: 6px;
      white-space: pre-wrap;
      max-height: 300px;
      overflow-y: auto;
      font-size: 13px;
    }

    #checkBtn, #checkUrlBtn {
      padding: 6px 12px;
      background-color: #3a3a3a;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    #checkBtn { margin-top: 10px; width: 100%; }
    #checkBtn:hover, #checkUrlBtn:hover { background:#505050; }
    #checkUrlBtn:disabled { opacity: 0.6; cursor: default; }

    .divider {
      margin-top: 14px;
      margin-bottom: 6px;
      font-size: 12px;
      color: #999;
      text-align: center;
    }

    #pasteRow {
      display: flex;
      gap: 6px;
    }

    #urlInput {
      flex: 1;
      min-width: 0;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #2c2c2c;
      color: #ffffff;
      font-size: 13px;
      box-sizing: border-box;
    }
    #urlInput:focus { outline: 1px solid #7aa7ff; }
  </style>
</head>
<body>
  <h3>URL Safety Checker</h3>

  <!-- EXTENSION WARNING BOX -->
  <div id="extWarning" style="
    display:none;
    background:#662222;
    color:#ffcccc;
    padding:8px;
    border-radius:6px;
    margin-bottom:10px;
    font-size:13px;
  "></div>

  <button id="checkBtn">Check This Page</button>

  <div class="divider">or paste a URL to check without opening it</div>
  <div id="pasteRow">
    <input type="text" id="urlInput" placeholder="https://example.com">
    <button id="checkUrlBtn">Check</button>
  </div>

  <pre id="result">Click a button to check a URL...</pre>

  <script src="popup.js"></script>
</body>
</html>
